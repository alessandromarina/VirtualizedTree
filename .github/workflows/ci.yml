name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  demo:
    runs-on: ubuntu-latest
    name: build the demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: examples/demo
      - name: Build
        run: npx vite build
        working-directory: examples/demo
